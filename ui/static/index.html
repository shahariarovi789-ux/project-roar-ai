<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project R.O.A.R.: Autonomous Multi-Agent Intelligent Tutoring System</title>
  <meta name="description" content="Adaptive Socratic tutoring in prompt engineering and computational systems. Five specialized cognitive agents coordinated over the Model Context Protocol (MCP) with guaranteed zero answer leakage.">
  <link rel="icon" type="image/svg+xml" href="/static/img/roar-symbol.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="/static/css/app.css?v=11.0">
</head>
<body>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Dedicated Homepage Root -->
  <div id="homepage-root"></div>

  <!-- Interactive Workspace App Shell -->
  <div id="app-root" style="display:none;">

    <!-- Sidebar -->
    <aside id="sidebar-container">

      <!-- Brand -->
      <div class="sb-brand">
        <div class="sb-brand-left">
          <img src="/static/img/roar-symbol.svg" alt="R.O.A.R. Logo" class="sb-logo-img">
          <div>
            <div class="sb-name">Project ROAR</div>
            <div class="sb-sub">Socratic AI Tutor</div>
          </div>
        </div>
        <div class="sb-brand-actions">
          <button id="btn-sidebar-home" class="sb-icon-btn" title="Return to Project Overview">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <path d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4.5a.5.5 0 0 0 .5-.5v-4h2v4a.5.5 0 0 0 .5.5H14a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L8.354 1.146z"/>
            </svg>
          </button>
          <button id="btn-settings-toggle" class="sb-icon-btn" title="Model &amp; System Settings">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          </button>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="sb-tabs">
        <button id="nav-btn-learn" class="sb-tab active">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
          Study
        </button>
        <button id="nav-btn-progress" class="sb-tab">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          Progress
        </button>
        <button id="nav-btn-exam" class="sb-tab">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Exam
        </button>
      </div>

      <!-- Curriculum List -->
      <div id="sidebar-curriculum-list">
        <div class="sb-loading-text">Loading curriculum nodes…</div>
      </div>

      <!-- Sidebar Footer -->
      <div class="sb-footer">
        <div class="sb-model-row">
          <div class="sb-model-badge" id="sidebar-model-container">
            <span class="sb-status-dot"></span>
            <span class="sb-model-name" id="sidebar-model-tag">connecting…</span>
          </div>
          <span class="sb-progress-chip" id="sidebar-progress-badge">0/36</span>
        </div>
        <div class="sb-user-row">
          <span class="sb-username" id="sidebar-username">Student</span>
          <button class="sb-logout" id="btn-logout">Sign out</button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main>

      <!-- App Header -->
      <header id="app-header">
        <div class="hdr-left">
          <button id="btn-header-home" class="hdr-btn" title="Return to Overview">
            <svg viewBox="0 0 16 16" fill="currentColor" style="width:13px;height:13px;margin-right:4px;">
              <path fill-rule="evenodd" d="M15 8a.75.75 0 0 1-.75.75H4.06l3.72 3.72a.75.75 0 1 1-1.06 1.06l-5-5a.75.75 0 0 1 0-1.06l5-5a.75.75 0 0 1 1.06 1.06L4.06 7.25h10.19A.75.75 0 0 1 15 8z"/>
            </svg>
            Overview
          </button>
          <span class="hdr-divider">/</span>
          <span class="hdr-breadcrumb" id="header-node-title">Node Title</span>
          <span class="hdr-tier-chip" id="header-tier-badge">Tier 1</span>
        </div>
        <div class="hdr-right">
          <button id="btn-header-provider-badge" class="hdr-btn" title="Switch inference provider">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:13px;height:13px;"><circle cx="12" cy="12" r="3" stroke-width="2"/><path stroke-width="2" stroke-linecap="round" d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            <span id="header-provider-text">Ollama</span>
          </button>
          <button id="btn-toggle-activity-feed" class="hdr-btn accent">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:13px;height:13px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            Agents
          </button>
          <div class="hdr-phase" id="header-phase-badge">LESSON</div>
        </div>
      </header>

      <!-- Activity Drawer -->
      <div id="activity-drawer" style="display:none;">
        <div class="drawer-header">
          <div class="drawer-title-row">
            <span class="drawer-pulse-dot"></span>
            <span class="drawer-title">Live Agent Telemetry</span>
          </div>
          <button id="btn-close-activity-drawer" class="drawer-close">Close</button>
        </div>
        <div id="activity-events-list">
          <div class="drawer-empty-state">Waiting for agent activity…</div>
        </div>
      </div>

      <!-- View Container -->
      <div id="view-container" tabindex="0"></div>
    </main>

  </div>

  <script type="module" src="/static/js/app.js?v=11.0"></script>
</body>
</html>
